<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible"
          content="ie=edge">
    <title>Tech Tracker</title>
    <link rel="stylesheet"
          href="styles.css">
</head>
<body>
<div class="container">
    <h2 class="heading">Progress</h2>
    <div class="progress">
        <div class="progress-bar">
            <div class="progress-value"
                 id="progress">

            </div>
        </div>
    </div>
    <div class="row"
         id="content">
    </div>
    <form class="form"
          id="form">
        <h2 class="heading">Add technology</h2>
        <div class="form-control">
            <label for="title">Title</label>
            <input type="text"
                   id="title"
                   name="title"
                   placeholder="Enter title">
        </div>
        <div class="form-control">
            <label for="description">Description</label>
            <textarea id="description"
                      name="description"
                      placeholder="Enter description"></textarea>
        </div>
        <button type="submit"
                class="btn">Create
        </button>
    </form>
</div>

<div class="modal"
     id="modal">
</div>
<div class="modal-backdrop"
     id="backdrop"></div>
<script src="app.js"></script>
</body>
</html>
